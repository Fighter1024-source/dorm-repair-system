<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>宿舍报修系统-注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-card {
            width: 360px;
            background: #ffffff;
            padding: 30px 24px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .login-card h3 {
            text-align: center;
            font-size: 20px;
            color: #333;
            margin-bottom: 24px;
        }
        .form-item {
            margin-bottom: 16px;
        }
        .form-item label {
            display: block;
            font-size: 14px;
            color: #444;
            margin-bottom: 6px;
        }
        .form-item input,
        .form-item select {
            width: 100%;
            height: 36px;
            padding: 0 10px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-item input:focus,
        .form-item select:focus {
            outline: none;
            border-color: #409eff;
        }
        .login-btn {
            width: 100%;
            height: 40px;
            background-color: #409eff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }
        .login-btn:hover {
            background-color: #66b1ff;
        }
        .link-box {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
        }
        .link-box a {
            color: #409eff;
            text-decoration: none;
        }
        .msg {
            text-align: center;
            margin-bottom:12px;
            font-size:14px;
        }
        .err {
            color:#f56c6c;
        }
        .ok {
            color:#67c23a;
        }
    </style>
</head>
<body>
<div class="login-card">
    <h3>宿舍报修系统注册</h3>
    <div id="msg" class="msg"></div>
    <form id="regForm">
        <div class="form-item">
            <label>账号</label>
            <input type="text" name="account" placeholder="请输入账号" required>
        </div>
        <div class="form-item">
            <label>密码</label>
            <input type="password" name="password" placeholder="请输入密码" required>
        </div>
        <div class="form-item">
            <label>确认密码</label>
            <input type="password" name="checkPwd" placeholder="再次输入密码" required>
        </div>
        <div class="form-item">
            <label>姓名</label>
            <input type="text" name="realName" placeholder="请输入姓名">
        </div>
        <div class="form-item">
            <label>手机号</label>
            <input type="text" name="phone" placeholder="请输入手机号">
        </div>
        <div class="form-item">
            <label>角色</label>
            <select name="role">
                <option value="student">学生</option>
                <option value="repairman">维修人员</option>
            </select>
        </div>
        <button type="submit" class="login-btn">注册</button>
    </form>
    <div class="link-box">
        已有账号？<a href="/login.html">去登录</a>
    </div>
</div>

<script>
    const form = document.getElementById('regForm');
    const msgDom = document.getElementById('msg');
    form.onsubmit = async (e) => {
        e.preventDefault();
        msgDom.innerText = '';
        msgDom.className = 'msg';
        const fd = new FormData(form);
        const data = Object.fromEntries(fd.entries());
        if(data.password !== data.checkPwd){
            msgDom.innerText = '两次密码不一致';
            msgDom.classList.add('err');
            return;
        }
        if(data.password.length < 6){
            msgDom.innerText = '密码至少6位';
            msgDom.classList.add('err');
            return;
        }
        try {
            const res = await fetch('/api/user/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });
            const result = await res.json();
            // 和登录接口保持一致，统一用success判断（推荐）
            if (result.success) {
                msgDom.innerText = '注册成功！跳转登录...';
                msgDom.classList.add('ok');
                setTimeout(()=>location.href="/login.html",1200);
            } else {
                msgDom.innerText = result.msg;
                msgDom.classList.add('err');
            }
        } catch (err) {
            msgDom.innerText = '请求失败，请检查服务';
            msgDom.classList.add('err');
        }
    }
</script>
</body>
</html>
