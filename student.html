<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>学生报修中心</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei"}
        body{padding:30px;background:#f7fafc}
        .container{max-width:1100px;margin:0 auto}
        .header{background:#3182ce;color:#fff;padding:16px;border-radius:8px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center}
        .box{background:#fff;padding:24px;border-radius:8px;margin-bottom:20px;box-shadow:0 2px 10px #00000010}
        h3{margin-bottom:16px;color:#2d3748}
        .row{margin-bottom:14px}
        label{display:block;margin-bottom:6px;color:#4a5568}
        input,textarea{width:100%;padding:10px;border:1px solid #cbd5e0;border-radius:6px;font-size:15px}
        button{padding:10px 20px;background:#3182ce;color:#fff;border:none;border-radius:6px;cursor:pointer;margin:2px}
        .reset{background:#718096;}
        .logout{background:#e53e3e}
        table{width:100%;border-collapse:collapse;margin-top:10px}
        th,td{border:1px solid #e2e8f0;padding:12px;text-align:center}
        th{background:#edf2f7}
        .page{margin-top:15px;text-align:center}
        .tip{color:red;font-size:14px}
        .img-preview{width:80px;cursor:pointer;}
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>学生报修页面</h2>
        <div>
            <span id="userName"></span>
            <button class="logout" onclick="logout()">退出登录</button>
        </div>
    </div>
    <div class="box">
        <h3>提交报修单</h3>
        <div class="row">
            <label>宿舍号</label>
            <input type="text" id="dormNo" placeholder="例如：2栋301">
            <div class="tip" id="tipDorm"></div>
        </div>
        <div class="row">
            <label>报修描述</label>
            <textarea id="content" rows="4" placeholder="描述故障情况"></textarea>
            <div class="tip" id="tipContent"></div>
        </div>
        <div class="row">
            <label>上传故障图片（可选）</label>
            <input type="file" id="imgFile" accept="image/*">
        </div>
        <button onclick="submitOrder()">提交报修</button>
        <button class="reset" onclick="resetForm()">重置</button>
    </div>
    <div class="box">
        <h3>我的报修工单</h3>
        <table>
            <thead>
            <tr><th>工单ID</th><th>宿舍号</th><th>报修内容</th><th>图片</th><th>状态</th><th>提交时间</th></tr>
            </thead>
            <tbody id="orderTable"></tbody>
        </table>
        <div class="page">
            <button onclick="prev()">上一页</button>
            <span id="pageInfo"></span>
            <button onclick="next()">下一页</button>
        </div>
    </div>
</div>
<script>
    let pageNum = 1;
    const pageSize = 5;
    let imgBase64 = "";
    let loginUser = null;
    const MAX_IMG_SIZE = 2 * 1024 * 1024; // 限制最大2MB

    // 安全读取localStorage，捕获异常，防止页面卡死
    try{
        let storageStr = localStorage.getItem("loginUser");
        if(storageStr){
            loginUser = JSON.parse(storageStr);
        }
    }catch(e){
        console.log("解析登录信息异常", e);
        localStorage.removeItem("loginUser");
    }

    // 校验登录状态
    if(!loginUser){
        location.href="/login.html";
    }else{
        let showName = loginUser.realName || loginUser.account;
        document.getElementById("userName").innerText = "欢迎："+ showName;
        loadOrder();
    }

    //图片选择，转base64 + 图片大小校验
    document.getElementById("imgFile").onchange = function(e){
        let file = e.target.files[0];
        if(!file) {
            imgBase64 = "";
            return;
        }
        // 判断图片大小
        if(file.size > MAX_IMG_SIZE){
            alert("图片过大！最大只能上传2MB，请压缩图片后重试");
            this.value = ""; //清空文件选择框
            imgBase64 = "";
            return;
        }
        let reader = new FileReader();
        reader.onload = function(event){
            imgBase64 = event.target.result;
        }
        reader.readAsDataURL(file);
    }

    //提交报修
    function submitOrder(){
        let dormNo = document.getElementById("dormNo").value.trim();
        let content = document.getElementById("content").value.trim();
        document.getElementById("tipDorm").innerText = "";
        document.getElementById("tipContent").innerText = "";
        if(!dormNo){
            document.getElementById("tipDorm").innerText = "请输入宿舍号";
            return;
        }
        if(!content){
            document.getElementById("tipContent").innerText = "请输入报修描述";
            return;
        }
        let param = {
            dormNo:dormNo,
            repairContent:content,
            imgUrl:imgBase64,
            userId:loginUser.id
        };
        fetch("/api/repair/submit",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(param)
        }).then(res=>res.json()).then(data=>{
            if(data.success){
                alert("报修提交成功！");
                //清空表单
                resetForm();
                loadOrder();
            }else{
                alert(data.msg || "提交失败");
            }
        }).catch(err=>{
            console.error(err);
            alert("提交失败");
        })
    }

    // 重置表单函数
    function resetForm(){
        document.getElementById("dormNo").value = "";
        document.getElementById("content").value = "";
        document.getElementById("imgFile").value = "";
        document.getElementById("tipDorm").innerText = "";
        document.getElementById("tipContent").innerText = "";
        imgBase64 = "";
    }

    //加载我的工单
    function loadOrder(){
        fetch(`/api/repair/myPage?userId=${loginUser.id}&pageNum=${pageNum}&pageSize=${pageSize}`)
            .then(res=>res.json()).then(data=>{
            if(!data || !data.data || !data.data.records){
                document.getElementById("orderTable").innerHTML = "<tr><td colspan='6'>暂无报修工单</td></tr>";
                document.getElementById("pageInfo").innerText = "";
                return;
            }
            let list = data.data.records;
            let total = data.data.total;
            let html = "";
            list.forEach(item=>{
                let imgHtml = item.imgUrl ? `<img class="img-preview" src="${item.imgUrl}" onclick="window.open('${item.imgUrl}')">`:"无";
                html += `<tr>
                    <td>${item.id}</td>
                    <td>${item.dormNo}</td>
                    <td>${item.repairContent}</td>
                    <td>${imgHtml}</td>
                    <td>${item.status}</td>
                    <td>${item.createTime}</td>
                </tr>`;
            })
            document.getElementById("orderTable").innerHTML = html;
            document.getElementById("pageInfo").innerText=`第${pageNum}页 / ${total}条`;
        }).catch(err=>{
            console.error(err);
        })
    }

    //分页
    function prev(){
        if(pageNum>1){
            pageNum--;
            loadOrder();
        }
    }
    function next(){
        pageNum++;
        loadOrder();
    }

    //退出登录
    function logout(){
        localStorage.clear();
        location.href="/login.html";
    }
</script>
</body>
</html>
