<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生报修中心</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Microsoft Yahei", "PingFang SC", sans-serif;
        }
        body{
            padding:30px;
            background: linear-gradient(135deg, #d4f7e1 0%, #e9faf1 100%);
        }
        .container{
            max-width:1100px;
            margin:0 auto;
        }
        .header{
            background: linear-gradient(135deg, #57c485, #34a46c);
            color:#fff;
            padding:18px 24px;
            border-radius:20px;
            margin-bottom:24px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow: 0 10px 24px rgba(52, 164, 108, 0.22);
        }
        .header h2{
            font-size:22px;
            font-weight:600;
        }
        .header span{
            font-size:15px;
            margin-right:14px;
        }
        .box{
            background:#fff;
            padding:28px;
            border-radius:20px;
            margin-bottom:24px;
            box-shadow:0 10px 30px rgba(87, 155, 118, 0.15);
        }
        h3{
            margin-bottom:20px;
            color:#2f4f3a;
            font-size:18px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        h3::before{
            content: "🛠️";
        }
        .box:last-of-type h3::before{
            content: "📋";
        }
        .row{
            margin-bottom:18px;
        }
        label{
            display:block;
            margin-bottom:8px;
            color:#4f6b5c;
            font-size:14px;
        }
        input,textarea{
            width:100%;
            padding:13px 16px;
            border:2px solid #e4f5ec;
            border-radius:14px;
            font-size:15px;
            background:#f8fffb;
            outline:none;
            transition: all 0.25s ease;
        }
        input:focus,textarea:focus{
            border-color:#57c485;
            box-shadow:0 0 0 4px rgba(87, 196, 133, 0.18);
            background:#ffffff;
        }
        button{
            padding:11px 22px;
            border:none;
            border-radius:14px;
            cursor:pointer;
            margin:4px;
            font-size:15px;
            font-weight:500;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover{
            transform: translateY(-2px);
        }
        .submit{
            background: linear-gradient(135deg, #57c485, #34a46c);
            color:#fff;
            box-shadow:0 8px 16px rgba(52, 164, 108, 0.28);
        }
        .reset{
            background:#b2c9be;
            color:#fff;
        }
        .logout{
            background:#f06565;
            color:#fff;
            box-shadow:0 6px 12px rgba(229, 62, 62, 0.22);
        }
        table{
            width:100%;
            border-collapse:collapse;
            margin-top:12px;
            border-radius:14px;
            overflow:hidden;
        }
        th,td{
            border:1px solid #e4f5ec;
            padding:14px 10px;
            text-align:center;
            font-size:14px;
        }
        th{
            background:#edf9f2;
            color:#2f4f3a;
            font-weight:600;
        }
        tr:nth-child(even){
            background:#f8fffb;
        }
        .page{
            margin-top:20px;
            text-align:center;
        }
        .tip{
            color:#e53e3e;
            font-size:13px;
            margin-top:4px;
        }
        .img-preview{
            width:80px;
            cursor:pointer;
            border-radius:8px;
            border:1px solid #e4f5ec;
        }
        /* 文件选择框美化 */
        input[type="file"]{
            padding:8px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>学生报修页面</h2>
        <div>
            <span id="userName"></span>
            <button class="logout" onclick="logout()">退出登录</button>
        </div>
    </div>
    <div class="box">
        <h3>提交报修单</h3>
        <div class="row">
            <label>宿舍号</label>
            <input type="text" id="dormNo" placeholder="例如：2栋301">
            <div class="tip" id="tipDorm"></div>
        </div>
        <div class="row">
            <label>报修描述</label>
            <textarea id="content" rows="4" placeholder="描述故障情况"></textarea>
            <div class="tip" id="tipContent"></div>
        </div>
        <div class="row">
            <label>上传故障图片（可选）</label>
            <input type="file" id="imgFile" accept="image/*">
        </div>
        <button class="submit" onclick="submitOrder()">提交报修</button>
        <button class="reset" onclick="resetForm()">重置</button>
    </div>
    <div class="box">
        <h3>我的报修工单</h3>
        <table>
            <thead>
            <tr><th>工单ID</th><th>宿舍号</th><th>报修内容</th><th>图片</th><th>状态</th><th>提交时间</th></tr>
            </thead>
            <tbody id="orderTable"></tbody>
        </table>
        <div class="page">
            <button onclick="prev()">上一页</button>
            <span id="pageInfo"></span>
            <button onclick="next()">下一页</button>
        </div>
    </div>
</div>
<script>
    let pageNum = 1;
    const pageSize = 5;
    let imgBase64 = "";
    let loginUser = null;
    const MAX_IMG_SIZE = 2 * 1024 * 1024;
    try{
        let storageStr = localStorage.getItem("loginUser");
        if(storageStr){
            loginUser = JSON.parse(storageStr);
        }
    }catch(e){
        console.log("解析登录信息异常", e);
        localStorage.removeItem("loginUser");
    }

    // ========== 角色守卫【重点】只有student可以访问 ==========
    if(!loginUser || loginUser.role !== "student"){
        alert("你不是学生，禁止访问该页面！");
        localStorage.removeItem("loginUser");
        location.href="/login.html";
    }else{
        let showName = loginUser.realName || loginUser.account;
        document.getElementById("userName").innerText = "欢迎："+ showName;
        loadOrder();
    }

    //图片选择
    document.getElementById("imgFile").onchange = function(e){
        let file = e.target.files[0];
        if(!file) {
            imgBase64 = "";
            return;
        }
        // 判断图片大小
        if(file.size > MAX_IMG_SIZE){
            alert("图片过大！最大只能上传2MB，请压缩图片后重试");
            this.value = "";
            imgBase64 = "";
            return;
        }
        let reader = new FileReader();
        reader.onload = function(event){
            imgBase64 = event.target.result;
        }
        reader.readAsDataURL(file);
    }

    //提交报修
    function submitOrder(){
        let dormNo = document.getElementById("dormNo").value.trim();
        let content = document.getElementById("content").value.trim();
        document.getElementById("tipDorm").innerText = "";
        document.getElementById("tipContent").innerText = "";
        if(!dormNo){
            document.getElementById("tipDorm").innerText = "请输入宿舍号";
            return;
        }
        if(!content){
            document.getElementById("tipContent").innerText = "请输入报修描述";
            return;
        }
        let param = {
            dormNo:dormNo,
            repairContent:content,
            imgUrl:imgBase64,
            userId:loginUser.id
        };
        fetch("/api/repair/submit",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(param)
        }).then(res=>res.json()).then(data=>{
            if(data.success){
                alert("报修提交成功！");
                resetForm();
                loadOrder();
            }else{
                alert(data.msg || "提交失败");
            }
        }).catch(err=>{
            console.error(err);
            alert("提交失败");
        })
    }
    function resetForm(){
        document.getElementById("dormNo").value = "";
        document.getElementById("content").value = "";
        document.getElementById("imgFile").value = "";
        document.getElementById("tipDorm").innerText = "";
        document.getElementById("tipContent").innerText = "";
        imgBase64 = "";
    }

    //加载我的工单
    function loadOrder(){
        fetch(`/api/repair/myPage?userId=${loginUser.id}&pageNum=${pageNum}&pageSize=${pageSize}`)
            .then(res=>res.json()).then(data=>{
            if(!data || !data.data || !data.data.records){
                document.getElementById("orderTable").innerHTML = "<tr><td colspan='6'>暂无报修工单</td></tr>";
                document.getElementById("pageInfo").innerText = "";
                return;
            }
            let list = data.data.records;
            let total = data.data.total;
            let html = "";
            list.forEach(item=>{
                let imgHtml = item.imgUrl ? `<img class="img-preview" src="${item.imgUrl}" onclick="window.open('${item.imgUrl}')">`:"无";
                html += `<tr>
                    <td>${item.id}</td>
                    <td>${item.dormNo}</td>
                    <td>${item.repairContent}</td>
                    <td>${imgHtml}</td>
                    <td>${item.status}</td>
                    <td>${item.createTime}</td>
                </tr>`;
            })
            document.getElementById("orderTable").innerHTML = html;
            document.getElementById("pageInfo").innerText=`第${pageNum}页 / ${total}条`;
        }).catch(err=>{
            console.error(err);
        })
    }

    //分页
    function prev(){
        if(pageNum>1){
            pageNum--;
            loadOrder();
        }
    }
    function next(){
        pageNum++;
        loadOrder();
    }

    //退出登录
    function logout(){
        localStorage.clear();
        location.href="/login.html";
    }
</script>
</body>
</html>
