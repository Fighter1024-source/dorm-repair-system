<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理员后台管理</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Microsoft Yahei", "PingFang SC", sans-serif;
        }
        body{
            padding:30px;
            background: linear-gradient(135deg, #d4f7e1 0%, #e9faf1 100%);
        }
        .container{
            max-width:1200px;
            margin:0 auto;
        }
        .header{
            background: linear-gradient(135deg, #57c485, #34a46c);
            color:#fff;
            padding:18px 24px;
            border-radius:20px;
            margin-bottom:24px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow: 0 10px 24px rgba(52, 164, 108, 0.22);
        }
        .header h2{
            font-size:22px;
            font-weight:600;
        }
        .header > div{
            display:flex;
            align-items:center;
            gap:14px;
        }
        .header > div span{
            font-size:15px;
        }
        .box{
            background:#fff;
            padding:28px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(87, 155, 118, 0.15);
            margin-bottom:24px;
        }
        h3{
            margin-bottom:20px;
            color:#2f4f3a;
            font-size:18px;
            display:flex;
            align-items:center;
            gap:8px;
        }
        .box:nth-child(2) h3::before{
            content: "📊";
        }
        .box:nth-child(3) h3::before{
            content: "📋";
        }
        table{
            width:100%;
            border-collapse:collapse;
            border-radius:14px;
            overflow:hidden;
        }
        th,td{
            border:1px solid #e4f5ec;
            padding:14px 10px;
            text-align:center;
            font-size:14px;
        }
        th{
            background:#edf9f2;
            color:#2f4f3a;
            font-weight:600;
        }
        tr:nth-child(even){
            background:#f8fffb;
        }
        button{
            padding:8px 14px;
            border:none;
            border-radius:12px;
            cursor:pointer;
            margin:0 4px;
            font-size:14px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover{
            transform: translateY(-2px);
        }
        .del-btn{
            background:#805ad5;
            color:#fff;
            box-shadow:0 4px 10px rgba(128,90,213,0.25);
        }
        .logout{
            background:#f06565;
            color:#fff;
            box-shadow:0 6px 12px rgba(229, 62, 62, 0.22);
        }
        .page{
            margin-top:20px;
            text-align:center;
        }
        .page button{
            background:#b2c9be;
            color:#fff;
        }
        .form-row{
            margin-bottom:16px;
            display:flex;
            gap:8px;
            align-items:center;
        }
        input,select{
            padding:10px 14px;
            border:2px solid #e4f5ec;
            border-radius:14px;
            background:#f8fffb;
            outline:none;
            transition: all 0.25s ease;
        }
        input:focus,select:focus{
            border-color:#57c485;
            box-shadow:0 0 0 4px rgba(87, 196, 133, 0.18);
            background:#ffffff;
        }
        .preview-img{
            width:80px;
            cursor:pointer;
            border-radius:8px;
            border:1px solid #e4f5ec;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>管理员后台管理</h2>
        <div>
            <span id="userName"></span>
            <button class="logout" onclick="logout()">退出登录</button>
        </div>
    </div>

    <div class="box">
        <h3>工单状态统计图表</h3>
        <div id="chart" style="width:100%;height:300px;"></div>
    </div>
    <div class="box">
        <h3>所有报修工单信息</h3>
        <table>
            <thead>
            <tr><th>工单ID</th><th>宿舍号</th><th>报修内容</th><th>图片</th><th>状态</th><th>提交时间</th></tr>
            </thead>
            <tbody id="repairTable"></tbody>
        </table>
        <div class="page">
            <button onclick="repairPrev()">上一页</button>
            <span id="repairPageInfo"></span>
            <button onclick="repairNext()">下一页</button>
        </div>
    </div>
</div>

<script>
    let loginUser = null;
    let userPage = 1;
    let userSize = 5;
    let repairPage = 1;
    let repairSize =5;
    let chartDom = document.getElementById('chart');
    let myChart = echarts.init(chartDom);

    try{
        let storageStr = localStorage.getItem("loginUser");
        if(storageStr){
            loginUser = JSON.parse(storageStr);
            console.log("管理员登录信息：",loginUser);
        }
    }catch(e){
        localStorage.removeItem("loginUser");
    }

    //管理员角色校验
    if(!loginUser || loginUser.role !== "admin"){
        alert("你不是管理员，禁止访问该页面！");
        localStorage.removeItem("loginUser");
        location.href="/login.html";
    }else{
        document.getElementById("userName").innerText = "欢迎："+ loginUser.account;
        loadUserList();
        loadRepairList();
        loadChart();
    }

    //加载统计饼图
    function loadChart(){
        fetch("/api/repair/count")
            .then(res=>res.json())
            .then(data=>{
                if(data.success){
                    let waitNum = data.data.wait ?? 0;
                    let doingNum = data.data.doing ?? 0;
                    let finishNum = data.data.finish ?? 0;
                    let option = {
                        title:{text:"工单状态统计",left:"center"},
                        tooltip:{trigger: 'item'},
                        series:[{
                            type:'pie',
                            radius:'60%',
                            data:[
                                {value:waitNum,name:'待维修'},
                                {value:doingNum,name:'维修中'},
                                {value:finishNum,name:'已完成'}
                            ]
                        }]
                    };
                    myChart.setOption(option);
                }else{
                    setTestChart();
                }
            }).catch(err=>{
            console.log("图表接口异常",err);
            setTestChart();
        })
    }
    function setTestChart(){
        myChart.setOption({
            title:{text:"工单状态统计",left:"center"},
            tooltip:{trigger: 'item'},
            series:[{
                type:'pie',
                radius:'60%',
                data:[
                    {value:1,name:'待维修'},
                    {value:1,name:'维修中'},
                    {value:1,name:'已完成'}
                ]
            }]
        })
    }

    //加载用户列表
    function loadUserList(){
        fetch(`/api/user/page?pageNum=${userPage}&pageSize=${userSize}`)
            .then(res=>res.json()).then(data=>{
            if(!data || !data.data || !data.data.records){
                document.getElementById("userTable").innerHTML = "<tr><td colspan='5'>暂无用户</td></tr>";
                document.getElementById("userPageInfo").innerText = `第${userPage}页 / 总共0条`;
                return;
            }
            let list = data.data.records;
            let total = data.data.total;
            let html = "";
            list.forEach(item=>{
                html += `<tr>
                    <td>${item.id}</td>
                    <td>${item.account}</td>
                    <td>${item.name}</td>
                    <td>${item.role}</td>
                    <td><button class="del-btn" onclick="delUser(${item.id})">删除</button></td>
                </tr>`;
            })
            document.getElementById("userTable").innerHTML = html;
            document.getElementById("userPageInfo").innerText=`第${userPage}页 / 总共${total}条`;
        })
    }

    //加载全部工单
    function loadRepairList(){
        fetch(`/api/repair/allPage?pageNum=${repairPage}&pageSize=${repairSize}`)
            .then(res=>res.json()).then(data=>{
            if(!data || !data.data || !data.data.records){
                document.getElementById("repairTable").innerHTML = "<tr><td colspan='6'>暂无报修工单</td></tr>";
                document.getElementById("repairPageInfo").innerText = `第${repairPage}页 / 总共0条`;
                return;
            }
            let list = data.data.records;
            let total = data.data.total;
            let html = "";
            list.forEach(item=>{
                let imgHtml = item.imgUrl ? `<img class="preview-img" src="${item.imgUrl}" onclick="window.open('${item.imgUrl}')">`:"无";
                html += `<tr>
                    <td>${item.id}</td>
                    <td>${item.dormNo}</td>
                    <td>${item.repairContent}</td>
                    <td>${imgHtml}</td>
                    <td>${item.status}</td>
                    <td>${item.createTime}</td>
                </tr>`;
            })
            document.getElementById("repairTable").innerHTML = html;
            document.getElementById("repairPageInfo").innerText=`第${repairPage}页 / 总共${total}条`;
        })
    }
    //工单分页
    function repairPrev(){if(repairPage>1){repairPage--;loadRepairList()}}
    function repairNext(){repairPage++;loadRepairList()}

    //退出登录
    function logout(){
        localStorage.clear();
        location.href="/login.html";
    }
</script>
</body>
</html>
